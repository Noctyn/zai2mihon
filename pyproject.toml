[project]
name = "zai2mihon"
version = "0.1.0"
description = "Export ZaiManhua (再漫画) subscriptions and reading history to Mihon backup (.tachibk)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "protobuf>=4.25.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[project.scripts]
zai2mihon = "zai2mihon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=8.0.0",
]
